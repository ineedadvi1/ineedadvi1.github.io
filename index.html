<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <!-- Password Screen -->
  <div id="lock-screen">
    <div id="lock-box">
      <div id="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <p id="lock-label">Enter Password</p>
      <div id="dots">
        <span class="dot" id="d1"></span>
        <span class="dot" id="d2"></span>
        <span class="dot" id="d3"></span>
        <span class="dot" id="d4"></span>
      </div>
      <div id="numpad">
        <button class="num" data-val="1">1</button>
        <button class="num" data-val="2">2</button>
        <button class="num" data-val="3">3</button>
        <button class="num" data-val="4">4</button>
        <button class="num" data-val="5">5</button>
        <button class="num" data-val="6">6</button>
        <button class="num" data-val="7">7</button>
        <button class="num" data-val="8">8</button>
        <button class="num" data-val="9">9</button>
        <button class="num" id="clear-btn" data-val="clear">⌫</button>
        <button class="num" data-val="0">0</button>
        <div></div>
      </div>
      <p id="wrong-msg"></p>
    </div>
  </div>
 
  <!-- Main App -->
  <div id="app" class="hidden">
    <h1 id="app-title">Portal</h1>
    <div id="grid">
 
      <a class="app-btn" href="https://www.instagram.com" target="_blank" rel="noopener">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="white" stroke="none"/>
          </svg>
        </div>
        <span>Instagram</span>
      </a>
 
      <a class="app-btn" href="https://www.snapchat.com" target="_blank" rel="noopener">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C8.5 2 6 4.5 6 8v1.5c-.8.2-1.5.5-1.5 1s.3.8 1 1c-.2.8-.8 1.5-1.5 2 0 0 1 .5 3 .5.5 1 1.5 2 3 2s2.5-1 3-2c2 0 3-.5 3-.5-.7-.5-1.3-1.2-1.5-2 .7-.2 1-.5 1-1s-.7-.8-1.5-1V8c0-3.5-2.5-6-6-6z"/>
          </svg>
        </div>
        <span>Snapchat</span>
      </a>
 
      <a class="app-btn" href="https://www.tiktok.com" target="_blank" rel="noopener">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>
          </svg>
        </div>
        <span>TikTok</span>
      </a>
 
      <a class="app-btn" href="https://www.youtube.com" target="_blank" rel="noopener">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="3"/>
            <polygon points="10,9 16,12 10,15" fill="white" stroke="none"/>
          </svg>
        </div>
        <span>YouTube</span>
      </a>
 
    </div>
    <p id="hint">Press <kbd>Esc</kbd> to lock</p>
  </div>
 
  <script src="app.js"></script>
</body>
</html>
