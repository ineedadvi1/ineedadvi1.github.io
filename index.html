<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launchpad</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #lock-box {
      display: flex; flex-direction: column; align-items: center; gap: 22px; width: 280px;
    }
    #lock-icon { width: 46px; height: 46px; opacity: 0.65; }
    #lock-label { font-size: 18px; font-weight: 300; color: rgba(255,255,255,0.85); letter-spacing: 0.02em; }

    #dots { display: flex; gap: 18px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.75);
      transition: background 0.15s;
    }
    .dot.filled { background: #fff; }

    #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
    .num {
      background: transparent; border: 1.5px solid rgba(255,255,255,0.75);
      border-radius: 14px; color: #fff; font-size: 22px; font-weight: 300;
      height: 64px; cursor: pointer; font-family: inherit;
      transition: background 0.12s, transform 0.08s;
    }
    .num:hover { background: rgba(255,255,255,0.08); }
    .num:active { background: rgba(255,255,255,0.18); transform: scale(0.95); }
    #clear-btn { font-size: 18px; }
    #wrong-msg { font-size: 13px; color: rgba(255,80,80,0.9); height: 18px; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* URL MODAL OVERLAY */
    #url-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    #url-box {
      background: #111; border: 1.5px solid rgba(255,255,255,0.75);
      border-radius: 20px; padding: 28px 24px;
      display: flex; flex-direction: column; gap: 16px; width: 320px;
    }
    #url-label { font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.85); }

    #url-input-wrap {
      display: flex; align-items: center;
      border: 1.5px solid rgba(255,255,255,0.5); border-radius: 12px;
      overflow: hidden; background: transparent;
      transition: border-color 0.15s;
    }
    #url-input-wrap:focus-within { border-color: #fff; }

    #url-prefix {
      padding: 10px 0 10px 14px;
      font-size: 15px; color: rgba(255,255,255,0.4);
      white-space: nowrap; user-select: none;
    }
    #url-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 15px; font-family: inherit;
      padding: 10px 14px 10px 0;
    }
    #url-input::placeholder { color: rgba(255,255,255,0.3); }

    #url-actions { display: flex; gap: 10px; }
    #url-cancel, #url-go {
      flex: 1; background: transparent;
      border: 1.5px solid rgba(255,255,255,0.75); border-radius: 12px;
      color: #fff; font-size: 15px; font-family: inherit;
      padding: 10px; cursor: pointer; transition: background 0.12s;
    }
    #url-cancel:hover { background: rgba(255,255,255,0.07); }
    #url-go:hover { background: rgba(255,255,255,0.15); }

    /* MAIN APP */
    #app {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
    }
    #app-title {
      font-size: 13px; font-weight: 300; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(255,255,255,0.35);
    }

    #grid {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 28px; max-width: 640px;
    }

    .app-btn {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: none; border: none; padding: 0; cursor: pointer;
      width: 100px;
      transition: transform 0.18s;
    }
    .app-btn:hover { transform: scale(1.08); }
    .app-btn:active { transform: scale(0.96); }

    .icon-wrap {
      width: 88px; height: 88px;
      border: none;
      border-radius: 20px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      transition: opacity 0.18s;
    }
    .app-btn:hover .icon-wrap { opacity: 0.85; }

    .app-icon { width: 100%; height: 100%; object-fit: cover; display: block; }
    .icon-wrap svg { width: 38px; height: 38px; }

    .app-btn span {
      font-size: 12px; font-weight: 300; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.45); transition: color 0.18s;
    }
    .app-btn:hover span { color: rgba(255,255,255,0.85); }

    #hint { font-size: 12px; color: rgba(255,255,255,0.18); letter-spacing: 0.05em; }
    #hint kbd {
      font-family: inherit; font-size: 11px;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;
      padding: 1px 5px; color: rgba(255,255,255,0.25);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lock-screen">
    <div id="lock-box">
      <div id="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <p id="lock-label">Enter Password</p>
      <div id="dots">
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
      </div>
      <div id="numpad">
        <button class="num" data-val="1">1</button>
        <button class="num" data-val="2">2</button>
        <button class="num" data-val="3">3</button>
        <button class="num" data-val="4">4</button>
        <button class="num" data-val="5">5</button>
        <button class="num" data-val="6">6</button>
        <button class="num" data-val="7">7</button>
        <button class="num" data-val="8">8</button>
        <button class="num" data-val="9">9</button>
        <button class="num" id="clear-btn" data-val="clear">⌫</button>
        <button class="num" data-val="0">0</button>
        <div></div>
      </div>
      <p id="wrong-msg"></p>
    </div>
  </div>

  <!-- URL MODAL -->
  <div id="url-modal" class="hidden">
    <div id="url-box">
      <p id="url-label">Go to website</p>
      <div id="url-input-wrap">
        <span id="url-prefix">https://</span>
        <input id="url-input" type="text" placeholder="example.com" autocomplete="off" spellcheck="false" />
      </div>
      <div id="url-actions">
        <button id="url-cancel">Cancel</button>
        <button id="url-go">Go</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <h1 id="app-title">Launchpad</h1>
    <div id="grid">

      <button class="app-btn" data-url="https://www.instagram.com">
        <div class="icon-wrap">
          <img class="app-icon" src="instagram.webp" alt="Instagram" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="white" stroke="none"/>
          </svg>
        </div>
        <span>Instagram</span>
      </button>

      <button class="app-btn" data-url="https://www.snapchat.com">
        <div class="icon-wrap">
          <img class="app-icon" src="snapchat.webp" alt="Snapchat" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C8.5 2 6 4.5 6 8v1.5c-.8.2-1.5.5-1.5 1s.3.8 1 1c-.2.8-.8 1.5-1.5 2 0 0 1 .5 3 .5.5 1 1.5 2 3 2s2.5-1 3-2c2 0 3-.5 3-.5-.7-.5-1.3-1.2-1.5-2 .7-.2 1-.5 1-1s-.7-.8-1.5-1V8c0-3.5-2.5-6-6-6z"/>
          </svg>
        </div>
        <span>Snapchat</span>
      </button>

      <button class="app-btn" data-url="https://www.tiktok.com">
        <div class="icon-wrap">
          <img class="app-icon" src="tiktok.webp" alt="TikTok" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>
          </svg>
        </div>
        <span>TikTok</span>
      </button>

      <button class="app-btn" data-url="https://www.youtube.com">
        <div class="icon-wrap">
          <img class="app-icon" src="youtube.webp" alt="YouTube" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="3"/>
            <polygon points="10,9 16,12 10,15" fill="white" stroke="none"/>
          </svg>
        </div>
        <span>YouTube</span>
      </button>

      <button class="app-btn" data-url="https://www.google.com">
        <div class="icon-wrap">
          <img class="app-icon" src="google.webp" alt="Google" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
          </svg>
        </div>
        <span>Google</span>
      </button>

      <button class="app-btn" id="custom-btn">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </div>
        <span>Custom</span>
      </button>

    </div>
    <p id="hint">Press <kbd>Esc</kbd> to lock</p>
  </div>

  <script>
    // Push a state so the back button hits this instead of leaving
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => {
      history.pushState(null, '', location.href);
    });

    const PASSWORD = '9999';
    let entry = '';

    const lockScreen = document.getElementById('lock-screen');
    const app        = document.getElementById('app');
    const urlModal   = document.getElementById('url-modal');
    const urlInput   = document.getElementById('url-input');
    const dots       = document.querySelectorAll('.dot');
    const wrongMsg   = document.getElementById('wrong-msg');
    const lockBox    = document.getElementById('lock-box');

    function updateDots() {
      dots.forEach((d, i) => d.classList.toggle('filled', i < entry.length));
    }

    function showWrong() {
      wrongMsg.textContent = 'Incorrect password';
      lockBox.classList.add('shake');
      lockBox.addEventListener('animationend', () => lockBox.classList.remove('shake'), { once: true });
      setTimeout(() => { wrongMsg.textContent = ''; }, 1500);
    }

    function tryUnlock() {
      if (entry === PASSWORD) {
        lockScreen.classList.add('hidden');
        app.classList.remove('hidden');
      } else {
        showWrong();
      }
      entry = '';
      updateDots();
    }

    function addDigit(val) {
      if (val === 'clear') { entry = entry.slice(0, -1); updateDots(); return; }
      if (entry.length >= 4) return;
      entry += val;
      updateDots();
      if (entry.length === 4) setTimeout(tryUnlock, 120);
    }

    function lock() {
      lockScreen.classList.remove('hidden');
      app.classList.add('hidden');
      urlModal.classList.add('hidden');
      entry = ''; updateDots(); wrongMsg.textContent = '';
    }

    function navigate(url) {
      window.location.href = url;
    }

    function openModal() {
      urlInput.value = '';
      urlModal.classList.remove('hidden');
      setTimeout(() => urlInput.focus(), 50);
    }

    function closeModal() { urlModal.classList.add('hidden'); }

    function goToUrl() {
      let val = urlInput.value.trim();
      if (!val) return;
      navigate('https://' + val);
    }

    // Numpad
    document.querySelectorAll('.num').forEach(btn =>
      btn.addEventListener('click', () => addDigit(btn.dataset.val))
    );

    // App icons
    document.querySelectorAll('.app-btn[data-url]').forEach(btn =>
      btn.addEventListener('click', () => navigate(btn.dataset.url))
    );

    // Custom button
    document.getElementById('custom-btn').addEventListener('click', openModal);
    document.getElementById('url-cancel').addEventListener('click', closeModal);
    document.getElementById('url-go').addEventListener('click', goToUrl);
    urlModal.addEventListener('click', e => { if (e.target === urlModal) closeModal(); });

    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') goToUrl();
      if (e.key === 'Escape') closeModal();
    });

    // Global keyboard
    document.addEventListener('keydown', e => {
      if (document.activeElement === urlInput) return;
      if (e.key === 'Escape') { lock(); return; }
      if (/^[0-9]$/.test(e.key)) addDigit(e.key);
      if (e.key === 'Backspace') addDigit('clear');
    });
  </script>
</body>
</html>
